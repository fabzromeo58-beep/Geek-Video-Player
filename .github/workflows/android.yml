name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GeekVPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned optimized release
        uses: actions/upload-artifact@v4
        with:
          name: GeekVPlayer-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/outputs/mapping/
